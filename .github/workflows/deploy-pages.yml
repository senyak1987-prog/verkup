name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - name: Validate sign studio
        run: |
          npm run test:sign-studio
          npm run test:sign-scene
          npm run test:letter-construction
          npm run test:panel-construction
          npm run test:sign-editor
          npm run test:font-surfaces
          npm run test:neon-curves
          npm run test:facade-models
          npm run test:scene-lighting
          npm run test:daylight
          npm run test:letter-frame
          npm run test:letter-rows
          npm run test:vector-pdf
          npm run test:backer-contours
          npm run test:rc-game
          npm run test:facade-rc
      - name: Build site
        env:
          VITE_BASE_PATH: /verkup/
        run: npm run build

      - name: Build embeddable RC game
        run: npm run build:rc-embed

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
